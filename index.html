<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト比較ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/7.0.0/diff.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            padding-right: 50px; /* バーのための余白 */
            background-color: #ffffff;
            color: #333;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 5px;
        }
        .flex-container {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-bottom: 15px;
        }
        .pane {
            flex: 1;
            width: 50%;
            display: flex;
            flex-direction: column;
        }
        .pane-header {
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-bottom: none;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }
        .controls {
            text-align: center;
            background-color: #f0f0f0;
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .controls label {
            margin: 0 10px;
            font-size: 15px;
            cursor: pointer;
        }
        button {
            margin-left: 20px;
            padding: 8px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .char-count {
            font-size: 12px;
            color: #888;
            font-weight: normal;
        }
        
        /* ミニマップ */
        .minimap {
            position: fixed;
            top: 0;
            right: 0;
            width: 40px;
            height: 100vh;
            background-color: rgba(240, 240, 240, 0.7);
            border-left: 1px solid #ccc;
            z-index: 1000;
            cursor: pointer;
            box-shadow: -2px 0 5px rgba(0,0,0,0.05);
        }
        .minimap-marker {
            position: absolute;
            left: 0;
            width: 100%;
            min-height: 3px;
            opacity: 0.8;
            pointer-events: none;
        }
        .minimap-marker.del-marker {
            background-color: #4da6ff;
        }
        .minimap-marker.ins-marker {
            background-color: #33cc33;
        }

        /* 差分ハイライト */
        .del {
            background-color: #cceeff;
            text-decoration: line-through;
        }
        .ins {
            background-color: #ccffcc;
            font-weight: bold;
        }

        /* 結果表示エリア */
        .result-pane {
            flex: 1;
            border: 1px solid #bbb;
            min-height: 250px;
            background-color: #fafafa;
            overflow-x: auto;
            tab-size: 4;
        }
        .diff-row {
            display: flex;
            width: 100%;
            border-bottom: 1px dashed #ddd;
        }
        .diff-row:last-child {
            border-bottom: none;
        }
        .diff-cell {
            flex: 1;
            width: 50%;
            padding: 2px 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            box-sizing: border-box;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .diff-cell.left-cell {
            border-right: 1px solid #bbb;
        }

        /* 【重要】反対側を「選択も干渉もできない」状態にするロック */
        .selecting-left .right-cell { user-select: none !important; pointer-events: none; }
        .selecting-right .left-cell { user-select: none !important; pointer-events: none; }
        /* ロック中のセルはカーソルをnot-allowedにして視覚的に示す（ロックセル自体は pointer-events: none でクリック不可） */
        .selecting-left .left-cell,
        .selecting-right .right-cell { cursor: default; }

        /* 上に戻るボタン */
        #back-to-top {
            position: fixed;
            bottom: 30px;
            right: 60px;
            width: 80px;
            height: 80px;
            background-color: #9fd9ff;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 30%;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: background-color 0.2s, opacity 0.3s;
            padding: 0;
            margin: 0;
            opacity: 0.8;
        }
        #back-to-top:hover {
            background-color: #2980b9;
            opacity: 1;
        }

        .diff-row:hover {
            background-color: #f6f8fa;
        }
        .diff-row.active-row {
            background-color: #fff8c5 !important;
            outline: 1px solid #e6ddae;
            z-index: 1;
            position: relative;
        }

        /* 類似度表示エリア */
        .similarity-wrapper {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .similarity-title {
            font-size: 18px;
            font-weight: bold;
        }
        .similarity-bar-container {
            flex: 1;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 0 20px;
            overflow: hidden;
            box-shadow: inset 1px 2px rgba(0,0,0,0.1);
        }
        .similarity-bar {
            height: 100%;
            background-color: #28a745;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), background-color 0.5s ease;
        }
        .similarity-score-box {
            text-align: right;
            min-width: 140px;
        }
        .similarity-score {
            font-size: 26px;
            font-weight: bold;
            color: #28a745;
        }
        .similarity-status {
            font-size: 12px;
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="pane">
            <div class="pane-header">
                <span>元のテキスト (変更前)</span>
                <span id="old-count" class="char-count"></span>
            </div>
            <textarea id="text-old" placeholder="ここに元のテキストを入力..."></textarea>
        </div>
        <div class="pane">
            <div class="pane-header">
                <span>新しいテキスト (変更後)</span>
                <span id="new-count" class="char-count"></span>
            </div>
            <textarea id="text-new" placeholder="ここに新しいテキストを入力..."></textarea>
        </div>
    </div>

    <div class="controls">
        <b>比較モード:</b>
        <label><input type="radio" name="mode" value="char"> 文字単位</label>
        <label><input type="radio" name="mode" value="word" checked> 単語単位</label>
        <label><input type="radio" name="mode" value="line"> 行単位</label>
        <label><input type="radio" name="mode" value="academic"> シミラリティチェッカー</label>
        <button onclick="swapTexts()">左右を入れ替える</button>
        <button onclick="compareText()">比較する</button>
    </div>

    <div id="similarity-container" style="display: none;">
        <div class="similarity-wrapper">
            <div class="similarity-title">テキスト類似度</div>
            <div class="similarity-bar-container">
                <div id="similarity-bar" class="similarity-bar"></div>
            </div>
            <div class="similarity-score-box">
                <div id="similarity-score" class="similarity-score">0.0%</div>
                <div id="similarity-status" class="similarity-status"></div>
            </div>
        </div>
    </div>

    <div id="result-container" style="display: none; flex-direction: column; margin-bottom: 20px;">
        <div class="flex-container" style="margin-bottom: 0;">
            <div class="pane" style="border: none; background: transparent; padding-bottom: 0;">
                <div class="pane-header">変更前（削除された部分）</div>
            </div>
            <div class="pane" style="border: none; background: transparent; padding-bottom: 0;">
                <div class="pane-header">変更後（追加された部分）</div>
            </div>
        </div>
        <div id="unified-result" class="result-pane" style="display: flex; flex-direction: column; padding: 0;">
        </div>
    </div>

    <div id="minimap" class="minimap" style="display: none;"></div>
    <button id="back-to-top" onclick="scrollToTop()" title="ページ上部へ戻る">↑</button>

    <script>
        let diffWorker = null;

        function compareText() {
            const textOld = document.getElementById('text-old').value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const textNew = document.getElementById('text-new').value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const mode = document.querySelector('input[name="mode"]:checked').value;

            document.getElementById('old-count').innerText = `${textOld.length}文字`;
            document.getElementById('new-count').innerText = `${textNew.length}文字`;

            const resultContainer = document.getElementById('unified-result');
            const resultWrapper = document.getElementById('result-container');
            const similarityContainer = document.getElementById('similarity-container');
            const minimap = document.getElementById('minimap');

            if (mode === 'academic') {
                similarityContainer.style.display = 'block';
            } else {
                similarityContainer.style.display = 'none';
            }

            // L3: 片側または両側が空の場合は差分を計算せず「差分はありません」を表示
            if (textOld === '' || textNew === '') {
                resultContainer.innerHTML = `
                    <div style="padding: 50px; text-align: center; width: 100%; color: #555; font-family: sans-serif;">
                        <strong>差分はありません</strong>
                        <div style="margin-top: 10px; font-size: 13px;">両方のテキスト欄に内容を入力してください。</div>
                    </div>
                `;
                resultWrapper.style.display = 'flex';
                minimap.style.display = 'none';
                return;
            }

            resultContainer.innerHTML = `
                <div style="padding: 50px; text-align: center; width: 100%; color: #555; font-family: sans-serif;">
                    <strong>差分を計算中...</strong>
                </div>
            `;
            resultWrapper.style.display = 'flex';
            minimap.style.display = 'none';

            // M5: Worker は一度だけ生成して再利用する（生成・破棄の無駄を省く）
            if (!diffWorker) {
                diffWorker = createDiffWorker();
                diffWorker.onmessage = function(e) {
                    if (e.data.error) {
                        handleDiffError(e.data.error);
                        return;
                    }
                    handleDiffResult(e.data.html, e.data.similarity);
                };
                diffWorker.onerror = function(e) {
                    handleDiffError(e.message || '不明なエラー');
                };
            }

            // H3: 30秒ウォッチドッグ — 計算がハングしたらタイムアウトとして扱わせる
            clearTimeout(diffWorker._watchdogId);
            const watchdogId = setTimeout(() => {
                handleDiffError('差分の計算が30秒を超過したためタイムアウトしました。');
            }, 30000);
            diffWorker._watchdogId = watchdogId;

            // H3: キャンセルボタンを表示
            const cancelBtn = document.createElement('button');
            cancelBtn.id = 'diff-cancel-btn';
            cancelBtn.textContent = 'キャンセル';
            cancelBtn.onclick = function() {
                cancelBtn.onclick = null;
                handleDiffError('ユーザーにより差分計算がキャンセルされました。');
            };
            document.querySelector('.controls').appendChild(cancelBtn);

            function handleDiffError(message) {
                clearTimeout(watchdogId);
                if (diffWorker && diffWorker._watchdogId === watchdogId) diffWorker._watchdogId = null;
                const btn = document.getElementById('diff-cancel-btn');
                if (btn) btn.remove();
                resultContainer.innerHTML = `
                    <div style="padding: 50px; text-align: center; width: 100%; color: #c00; font-family: sans-serif;">
                        <strong>${escapeHtmlMain(message)}</strong>
                    </div>
                `;
                minimap.style.display = 'none';
            }

            function escapeHtmlMain(str) {
                return String(str).replace(/[&<>'"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[m]));
            }

            function handleDiffResult(finalHtml, similarityValue) {
                clearTimeout(watchdogId);
                if (diffWorker && diffWorker._watchdogId === watchdogId) diffWorker._watchdogId = null;
                const btn = document.getElementById('diff-cancel-btn');
                if (btn) btn.remove();

                if (mode === 'academic') {
                    const scoreEl = document.getElementById('similarity-score');
                    const barEl = document.getElementById('similarity-bar');
                    const statusEl = document.getElementById('similarity-status');
                    const simVal = similarityValue.toFixed(1);
                    scoreEl.innerText = `${simVal}%`;
                    barEl.style.width = `${simVal}%`;
                    let color = '#28a745'; let status = '安全';
                    if (similarityValue >= 75) { color = '#dc3545'; status = '極めて高い類似性'; }
                    else if (similarityValue >= 50) { color = '#fd7e14'; status = '高い類似性'; }
                    else if (similarityValue >= 25) { color = '#ffc107'; status = '要注意'; }
                    else if (similarityValue >= 15) { color = '#17a2b8'; status = '許容範囲内'; }
                    scoreEl.style.color = color; barEl.style.backgroundColor = color;
                    statusEl.innerText = status; statusEl.style.color = color;
                }

                resultContainer.innerHTML = finalHtml;
                minimap.style.display = 'block';
                // M3: 結果の innerHTML が置き換わったため、選択ロック用のセルキャッシュを再生成する
                if (typeof window.refreshCellCache === 'function') window.refreshCellCache();
                // M1: 200msのsetTimeoutの代わりに requestAnimationFrame を2回重ねて描画反映を待つ
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        drawMinimap();
                    });
                });
            }

            diffWorker.postMessage({ textOld, textNew, mode });
        }

        // M5: Worker を一度生成して再利用する（Object URL をリークしない）
        function createDiffWorker() {
            const workerCode = `
                // H3: importScripts の失敗を postMessage で送出する
                try {
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/jsdiff/7.0.0/diff.min.js');
                } catch (err) {
                    self.postMessage({ error: '差分ライブラリの読み込みに失敗しました: ' + (err && err.message ? err.message : String(err)) });
                }

                self.onmessage = function(e) {
                    try {
                        const textOld = e.data.textOld;
                        const textNew = e.data.textNew;
                        const mode = e.data.mode;

                        let diffResult;
                        let similarity = 0;

                        if (mode === 'academic') {
                            const n = 10;
                            const strOld = textOld.replace(/[\\s\\r\\n　]+/g, '');
                            const strNew = textNew.replace(/[\\s\\r\\n　]+/g, '');

                            const getNGrams = (str, n) => {
                                const ngrams = new Set();
                                for (let i = 0; i <= str.length - n; i++) {
                                    ngrams.add(str.substring(i, i + n));
                                }
                                return ngrams;
                            };

                            if (strOld.length < n || strNew.length < n) {
                                similarity = (strOld === strNew && strOld !== '') ? 100 : 0;
                            } else {
                                const setA = getNGrams(strOld, n);
                                const setB = getNGrams(strNew, n);
                                let intersection = 0;
                                for (let gram of setA) {
                                    if (setB.has(gram)) intersection++;
                                }
                                const union = setA.size + setB.size - intersection;
                                similarity = union === 0 ? 0 : (intersection / union) * 100;
                            }
                            diffResult = Diff.diffChars(textOld, textNew);
                        } else {
                            if (mode === 'line') diffResult = Diff.diffLines(textOld, textNew);
                            else if (mode === 'word') diffResult = Diff.diffWords(textOld, textNew);
                            else diffResult = Diff.diffChars(textOld, textNew);
                        }

                        const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
                        const escapeHtml = (str) => str.replace(/[&<>'"]/g, match => escapeMap[match] || match);

                        // H4: 行モードのみ「part を 1行ずつ左右に分配し、行数の多い側に合わせて反対側を空行でパッド」。
                        // 文字/単語モードは各 part を行内にインラインで描画し、空行パッドしない。
                        const isLineMode = (mode === 'line');
                        const htmlChunks = [];

                        if (!isLineMode) {
                            // H4: 文字/単語モード → 各 part を1行にインラインで描画
                            diffResult.forEach(part => {
                                const value = escapeHtml(part.value);
                                let leftHtml = '', rightHtml = '';
                                if (part.added) {
                                    // L6: 空行は nbsp を入れた ins/del として表示
                                    rightHtml = (value === '' ? '<span class="ins">&nbsp;</span>' : '<span class="ins">' + value + '</span>');
                                } else if (part.removed) {
                                    leftHtml = (value === '' ? '<span class="del">&nbsp;</span>' : '<span class="del">' + value + '</span>');
                                } else {
                                    leftHtml = value;
                                    rightHtml = value;
                                }
                                htmlChunks.push(
                                    '<div class="diff-row">' +
                                        '<div class="diff-cell left-cell">' + leftHtml + '</div>' +
                                        '<div class="diff-cell right-cell">' + rightHtml + '</div>' +
                                    '</div>'
                                );
                            });
                            self.postMessage({ html: htmlChunks.join(''), similarity: similarity });
                            return;
                        }

                        // 行モード: 左右の行バッファを構築し、part 間で行を揃える
                        let leftRows = [], rightRows = [];
                        let pendingLeft = [], pendingRight = [];
                        const flushPending = () => {
                            const max = Math.max(pendingLeft.length, pendingRight.length);
                            for (let i = 0; i < max; i++) {
                                leftRows.push(i < pendingLeft.length ? pendingLeft[i] : '');
                                rightRows.push(i < pendingRight.length ? pendingRight[i] : '');
                            }
                            pendingLeft = [];
                            pendingRight = [];
                        };

                        diffResult.forEach(part => {
                            let lines = part.value.split('\\n');
                            // part.value の末尾が改行なら行分割で末尾に空要素が入る。
                            // 最後の行が '' だった場合だけ除去(意図した行を壊さない)
                            if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
                            if (lines.length === 0) lines = [''];
                            lines.forEach(text => {
                                const escaped = escapeHtml(text);
                                if (part.added) {
                                    // L6: 空行は nbsp を入れた ins/del として表示
                                    pendingRight.push(escaped === '' ? '<span class="ins">&nbsp;</span>' : '<span class="ins">' + escaped + '</span>');
                                } else if (part.removed) {
                                    pendingLeft.push(escaped === '' ? '<span class="del">&nbsp;</span>' : '<span class="del">' + escaped + '</span>');
                                } else {
                                    pendingLeft.push(text);
                                    pendingRight.push(text);
                                }
                            });
                            // 連続する変更part同士で行数が異なると対応がずれるため、
                            // 各partの末尾で揃えてバッファを確定する
                            flushPending();
                        });
                        flushPending();

                        // 行モードのみ: 空セルは見た目用の非表示行
                        for (let i = 0; i < leftRows.length; i++) {
                            const l = leftRows[i] === '' ? '<span style="visibility:hidden;">&nbsp;</span>' : leftRows[i];
                            const r = rightRows[i] === '' ? '<span style="visibility:hidden;">&nbsp;</span>' : rightRows[i];
                            htmlChunks.push(
                                '<div class="diff-row">' +
                                    '<div class="diff-cell left-cell">' + l + '</div>' +
                                    '<div class="diff-cell right-cell">' + r + '</div>' +
                            '</div>'
                            );
                        }

                        self.postMessage({ html: htmlChunks.join(''), similarity: similarity });
                    } catch (err) {
                        self.postMessage({ error: '差分の計算に失敗しました: ' + (err && err.message ? err.message : String(err)) });
                    }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            // M5: Object URL を保持し、beforeunload で revoke できるようにする
            workerObjectUrl = url;
            return new Worker(url);
        }

        function drawMinimap() {
            const minimap = document.getElementById('minimap');
            minimap.innerHTML = '';
            const resultPane = document.getElementById('unified-result');
            if (!resultPane) return;

            // H1/H2: マーカー位置・クリックスクロールは「結果pane基準」で計算する
            const paneRect = resultPane.getBoundingClientRect();
            const paneTopAbsolute = paneRect.top + window.scrollY;
            const paneHeight = Math.max(resultPane.scrollHeight, paneRect.height, 1);
            const viewHeight = window.innerHeight;

            const createMarkers = (selector, markerClass) => {
                document.querySelectorAll(selector).forEach(el => {
                    const rect = el.getBoundingClientRect();
                    const relativeTop = (rect.top + window.scrollY) - paneTopAbsolute;
                    const topPercent = (relativeTop / paneHeight) * 100;
                    const heightPercent = (rect.height / paneHeight) * 100;

                    const marker = document.createElement('div');
                    marker.className = `minimap-marker ${markerClass}`;
                    marker.style.top = `${Math.max(topPercent, 0)}%`;
                    marker.style.height = `${Math.max(heightPercent, 0.3)}%`;
                    minimap.appendChild(marker);
                });
            };

            createMarkers('.left-cell .del', 'del-marker');
            createMarkers('.right-cell .ins', 'ins-marker');

            // H2: クリック位置（viewport内の縦）をマーカー描画と同一基準（pane 全体 = scrollHeight）で
            // pane 内位置に変換し、そこにスクロールさせる。
            // paneRect.height はビューポートでクリップされた高さのため、ここで使ってはいけない。
            minimap.onclick = (e) => {
                const clickY = e.clientY;
                const clickRelative = (clickY - paneRect.top) / Math.max(paneHeight, 1);
                const target = paneTopAbsolute + clickRelative * paneHeight;
                window.scrollTo({
                    top: target - (viewHeight / 2),
                    behavior: 'smooth'
                });
            };
        }

        window.addEventListener('scroll', () => {
            const btn = document.getElementById('back-to-top');
            if (window.scrollY > 300) {
                btn.style.display = 'flex';
            } else {
                btn.style.display = 'none';
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let swapTimer = null;
        function swapTexts() {
            const o = document.getElementById('text-old');
            const n = document.getElementById('text-new');
            const t = o.value; o.value = n.value; n.value = t;
            // M4: 連続クリックをまとめて1回だけ再計算する（デバウンス）
            if (document.getElementById('result-container').style.display !== 'none') {
                clearTimeout(swapTimer);
                swapTimer = setTimeout(() => compareText(), 300);
            }
        }

        window.addEventListener('resize', () => {
            if (document.getElementById('minimap').style.display !== 'none') drawMinimap();
        });

        // minimap は fixed（viewport全体）に表示されるため、スクロールしても pane 基準の
        // マーカー位置は再計算が必要。スロットリング付きで再描画する。
        let minimapScrollPending = false;
        window.addEventListener('scroll', () => {
            if (document.getElementById('minimap').style.display === 'none') return;
            if (minimapScrollPending) return;
            minimapScrollPending = true;
            requestAnimationFrame(() => {
                minimapScrollPending = false;
                drawMinimap();
            });
        });

        // M5: Worker を一度生成して再利用するため、その Object URL を保持して
        // ページ離脱時に terminate 後確実に revoke する（URL リークを防止）
        let workerObjectUrl = null;

        // ページ離脱時に Worker を確実に terminate し、Object URL も解放する
        window.addEventListener('beforeunload', () => {
            if (diffWorker) {
                diffWorker.terminate();
                diffWorker = null;
            }
            if (workerObjectUrl) {
                URL.revokeObjectURL(workerObjectUrl);
                workerObjectUrl = null;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const unifiedResult = document.getElementById('unified-result');
            
            // 【解決策：永続ロック】
            // クリック（mousedown）した瞬間に反対側をロックし、次にクリックされるまでロックを解除しない
            unifiedResult.addEventListener('mousedown', (e) => {
                // 新しい操作のたびに一旦すべてのロックを解除
                unifiedResult.classList.remove('selecting-left', 'selecting-right');

                const leftCell = e.target.closest('.left-cell');
                const rightCell = e.target.closest('.right-cell');
                // M3: 新しい結果の描画後はセルキャッシュを再生成する
                setActive(leftCell || rightCell);
                if (leftCell) {
                    unifiedResult.classList.add('selecting-left');
                } else if (rightCell) {
                    unifiedResult.classList.add('selecting-right');
                }
            });

            // 【FIX #1】pointer-events: none だけでは、進行中の選択の終了ドラッグが
            // ロックセルに重なると選択範囲が縮んでしまう。
            // セルをまたいで選択が試みられたら、選択の端点をアクティブ側（選択中の側）に
            // 強制して、反対側への選択の拡大・縮小を JS でも防止する。
            // M3: セルリストは結果描画時だけ1回取得してキャッシュし、
            // document レベルのリスナーは「ロック中」のときだけ有効化する。
            let cachedCells = { left: null, right: null };
            // M3: DOMContentLoaded クロージャの外（compareText の結果描画時）から呼べるよう window に公開する
            const refreshCellCache = () => {
                cachedCells.left = Array.from(unifiedResult.querySelectorAll('.left-cell'));
                cachedCells.right = Array.from(unifiedResult.querySelectorAll('.right-cell'));
            };
            window.refreshCellCache = refreshCellCache;
            const setActive = (el) => {
                if (!el) return;
                // innerHTML が置き換わると el が無効になるためキャッシュを再生成
                if (!unifiedResult.contains(el)) refreshCellCache();
            };

            const isSelectionWithinActiveSide = (selection, activeCells) => {
                if (selection.rangeCount === 0) return true;
                for (const node of [selection.anchorNode, selection.focusNode]) {
                    if (!node) continue;
                    let inActive = false;
                    for (const cell of activeCells) {
                        if (cell.contains(node)) { inActive = true; break; }
                    }
                    if (!inActive) return false;
                }
                return true;
            };

            const lockSelectionToActiveSide = (e) => {
                const isSelectingLeft = unifiedResult.classList.contains('selecting-left');
                const isSelectingRight = unifiedResult.classList.contains('selecting-right');
                if (!isSelectingLeft && !isSelectingRight) return;

                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0) return;

                // M3: キャッシュ済みセルを使い、選択が既にアクティブ側内なら早期終了
                const activeCells = isSelectingLeft ? cachedCells.left : cachedCells.right;
                if (!activeCells || activeCells.length === 0) return;
                if (isSelectionWithinActiveSide(selection, activeCells)) return;

                let activeNode = null;
                for (const cell of activeCells) {
                    if (cell.contains(selection.anchorNode)) { activeNode = cell; break; }
                    if (cell.contains(selection.focusNode)) { activeNode = cell; break; }
                }
                if (!activeNode) return;

                // anchor と focus が異なるセル（＝反対側）にある場合のみ、
                // focus をアクティブセル内の最後のテキストノードに固定する。
                const anchorInActive = activeNode.contains(selection.anchorNode);
                const focusInActive = activeNode.contains(selection.focusNode);
                if (anchorInActive === focusInActive) return; // 両方ともアクティブ側なら何もしない

                const range = document.createRange();
                let lastTextNode = null;
                const walker = document.createTreeWalker(activeNode, NodeFilter.SHOW_TEXT, null);
                while (walker.nextNode()) lastTextNode = walker.currentNode;

                if (lastTextNode) {
                    if (selection.anchorNode === selection.focusNode) {
                        selection.removeAllRanges();
                    } else if (anchorInActive) {
                        // anchor がアクティブ側：focus をアクティブ側末端へ
                        range.setStart(selection.anchorNode, selection.anchorOffset);
                        range.setEnd(lastTextNode, lastTextNode.length);
                    } else {
                        // focus がアクティブ側：anchor をアクティブ側先頭へ
                        range.setStart(lastTextNode, 0);
                        range.setEnd(selection.focusNode, selection.focusOffset);
                    }
                    selection.removeAllRanges();
                    selection.addRange(range);
                    e.preventDefault();
                }
            };

            // M3: ドラッグ中は unifiedResult 内の mousemove を監視（document レベルは使用しない）
            unifiedResult.addEventListener('mousemove', lockSelectionToActiveSide);
            unifiedResult.addEventListener('mouseup', lockSelectionToActiveSide);

            // mouseupでクラスを消すのをやめる（ブラウザの勝手な再選択を防ぐ）
            // その代わり、画面のどこかを普通にクリックした時に選択範囲が消えるのと同時にロックも外れるようにする
            window.addEventListener('mousedown', (e) => {
                if (!e.target.closest('.result-pane')) {
                    unifiedResult.classList.remove('selecting-left', 'selecting-right');
                }
            });

            const highlightCorrespondingRow = (event) => {
                document.querySelectorAll('.diff-row.active-row').forEach(row => row.classList.remove('active-row'));
                const selection = window.getSelection();
                let targetNode = event.target;
                if (selection.toString().length > 0 && selection.anchorNode) {
                    targetNode = selection.anchorNode.nodeType === 3 ? selection.anchorNode.parentNode : selection.anchorNode;
                }
                const diffRow = targetNode.closest('.diff-row');
                if (diffRow) diffRow.classList.add('active-row');
            };
            // L2: 行ハイライトは click のみで1回だけ発火させる（mousemove/up 双方では二重に発火していた）
            unifiedResult.addEventListener('click', highlightCorrespondingRow);
        });
    </script>
</body>
</html>
